<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>七年级英语单词连连看 - 轻松学习版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial Rounded MT Bold', 'Microsoft YaHei', sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1e3c72 0%, #2b5876 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            color: #fff;
        }
        
        .container {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            padding: 25px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }
        
        header {
            text-align: center;
            margin-bottom: 20px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 8px;
            text-shadow: 3px 3px 0 rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
        }
        
        .subtitle {
            font-size: 1rem;
            opacity: 0.9;
            background: rgba(0,0,0,0.2);
            display: inline-block;
            padding: 5px 15px;
            border-radius: 40px;
        }
        
        .stats {
            display: flex;
            justify-content: space-between;
            background: rgba(0, 0, 0, 0.3);
            padding: 15px 20px;
            border-radius: 28px;
            margin-bottom: 20px;
            gap: 12px;
            flex-wrap: wrap;
        }
        
        .stat-item {
            text-align: center;
            flex: 1;
            background: rgba(255,255,240,0.1);
            border-radius: 20px;
            padding: 8px 5px;
            min-width: 70px;
        }
        
        .stat-label {
            font-size: 0.8rem;
            opacity: 0.8;
            letter-spacing: 1px;
        }
        
        .stat-value {
            font-size: 1.8rem;
            font-weight: bold;
            line-height: 1.2;
        }
        
        .stage-indicator {
            text-align: center;
            font-size: 1.3rem;
            margin-bottom: 18px;
            background: rgba(255, 215, 0, 0.2);
            padding: 10px;
            border-radius: 40px;
            font-weight: bold;
            backdrop-filter: blur(4px);
        }
        
        .game-board {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 14px;
            margin-bottom: 25px;
        }
        
        .card {
            aspect-ratio: 1/0.9;
            background: linear-gradient(145deg, #f9f3e6, #ffe6c7);
            color: #2c3e66;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            transition: all 0.2s ease;
            padding: 8px;
            text-align: center;
            word-break: break-word;
            border: 2px solid rgba(255,255,200,0.8);
        }
        
        .card:hover {
            transform: translateY(-4px);
            background: #fff6e8;
            box-shadow: 0 12px 20px rgba(0, 0, 0, 0.25);
        }
        
        .card.selected {
            background: #ffb347;
            color: white;
            transform: scale(1.02);
            border-color: #ffdd99;
            box-shadow: 0 0 0 3px #fff3bf;
        }
        
        .card.matched {
            background: #5cb85c;
            cursor: default;
            opacity: 0.6;
            transform: scale(0.92);
            filter: grayscale(0.1);
            border-color: #d4ffd4;
            box-shadow: none;
        }
        
        .card.error {
            background: #e67e22;
            animation: shake 0.4s ease-in-out;
            border-color: #ffaa88;
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }
        
        button {
            padding: 12px 28px;
            border: none;
            border-radius: 60px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #ffaa44;
            color: #2c3e50;
            box-shadow: 0 6px 0 #b4621a;
        }
        
        button:active {
            transform: translateY(2px);
            box-shadow: 0 3px 0 #b4621a;
        }
        
        button:hover {
            background: #ffbb55;
            transform: translateY(-2px);
            box-shadow: 0 8px 0 #b4621a;
        }
        
        #restart {
            background: #e67e22;
            color: white;
            box-shadow: 0 6px 0 #a04000;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background: linear-gradient(135deg, #2c3e66, #1a2a44);
            padding: 30px;
            border-radius: 48px;
            width: 90%;
            max-width: 460px;
            text-align: center;
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.6);
            border: 1px solid gold;
        }
        
        .modal h2 {
            margin-bottom: 20px;
            font-size: 2rem;
            color: #ffd966;
        }
        
        .modal p {
            margin-bottom: 12px;
            font-size: 1.2rem;
            background: rgba(0,0,0,0.3);
            border-radius: 40px;
            padding: 5px;
        }
        
        .modal input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border: none;
            border-radius: 60px;
            font-size: 1rem;
            text-align: center;
            background: #fef7e0;
        }
        
        .modal button {
            width: 80%;
            background: #5cb85c;
            color: white;
            box-shadow: 0 4px 0 #2c6b2c;
        }
        
        .success-message {
            display: none;
            background: #2ecc71;
            color: white;
            padding: 16px;
            border-radius: 60px;
            margin-top: 20px;
            text-align: center;
            font-weight: bold;
            font-size: 1.2rem;
            animation: fadeGlow 1s;
        }
        
        @keyframes fadeGlow {
            0% { opacity: 0; transform: scale(0.9);}
            100% { opacity: 1; transform: scale(1);}
        }
        
        .error-words {
            background: rgba(0, 0, 0, 0.4);
            padding: 15px;
            border-radius: 28px;
            margin-top: 20px;
            backdrop-filter: blur(4px);
        }
        
        .error-words h3 {
            margin-bottom: 12px;
            font-size: 1.1rem;
        }
        
        .error-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
        }
        
        .error-item {
            background: rgba(230, 126, 34, 0.8);
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: bold;
        }
        
        .timer-critical {
            color: #ffaa66;
            animation: pulse 0.8s infinite;
            text-shadow: 0 0 3px red;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        
        .stage-complete {
            background: rgba(46, 204, 113, 0.3);
            padding: 18px;
            border-radius: 50px;
            margin: 15px 0;
            text-align: center;
            font-size: 1.4rem;
            font-weight: bold;
            backdrop-filter: blur(8px);
        }
        
        @media (max-width: 720px) {
            .game-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 10px;
            }
            h1 { font-size: 1.8rem; }
            .card { font-size: 1rem; }
        }
        
        @media (max-width: 500px) {
            .game-board {
                grid-template-columns: repeat(3, 1fr);
            }
            .stats { flex-direction: row; flex-wrap: wrap; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📚 英语单词连连看</h1>
            <p class="subtitle">🐣 人教社七年级 · 轻松匹配挑战</p>
        </header>
        
        <div class="stage-indicator" id="stage-indicator">
            🌟 第一阶段：10组基础单词
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">📦 剩余卡片</div>
                <div class="stat-value" id="remaining">20</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">⚠️ 错误次数</div>
                <div class="stat-value" id="mistakes">0/15</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">⭐ 得分</div>
                <div class="stat-value" id="score">100</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">⏱️ 剩余时间</div>
                <div class="stat-value" id="timer">90</div>
            </div>
        </div>
        
        <div class="stage-complete" id="stage-complete">
            🎉 太棒了！进入第二阶段 🎉
        </div>
        
        <div class="game-board" id="game-board">
            <!-- 动态卡片 -->
        </div>
        
        <div class="error-words" id="error-words" style="display: none;">
            <h3>📖 易错单词本 (加强记忆)</h3>
            <div class="error-list" id="error-list"></div>
        </div>
        
        <div class="controls">
            <button id="start">🎮 开始游戏</button>
            <button id="restart">🔄 重新开始</button>
        </div>
        
        <div class="success-message" id="success-message">
            ✅ 成绩提交成功！ 继续加油~
        </div>
    </div>
    
    <div class="modal" id="result-modal">
        <div class="modal-content">
            <h2>🏆 游戏结束</h2>
            <p>✨ 最终得分: <strong id="final-score">0</strong></p>
            <p>🎯 完成阶段: <span id="final-stage">1</span></p>
            <p>🧩 剩余卡片: <span id="final-remaining">0</span></p>
            <p>📘 错误次数: <span id="final-mistakes">0</span>/15</p>
            <p>📝 留下大名，记录你的进步</p>
            <input type="text" id="player-name" placeholder="例如: 李华 / Lucy" maxlength="20">
            <button id="submit-score">✨ 提交成绩 ✨</button>
        </div>
    </div>

    <script>
        // ======================= 七年级单词库 (20组经典词汇) =======================
        const wordPairs = [
            ["apple", "苹果"], ["book", "书"], ["cat", "猫"], ["dog", "狗"],
            ["elephant", "大象"], ["friend", "朋友"], ["garden", "花园"], ["house", "房子"],
            ["ice cream", "冰淇淋"], ["juice", "果汁"], ["kite", "风筝"], ["lion", "狮子"],
            ["monkey", "猴子"], ["notebook", "笔记本"], ["orange", "橙子"], ["pencil", "铅笔"],
            ["queen", "女王"], ["rabbit", "兔子"], ["school", "学校"], ["teacher", "老师"]
        ];
        
        // ======================= 轻松模式参数 =======================
        const MAX_MISTAKES = 15;      // 最多允许错误15次 (原版10次)
        const TIME_PER_STAGE = 90;    // 每阶段90秒 (原版30秒, 大幅延长)
        const PENALTY_SCORE = 5;      // 每次错误扣5分 (原版扣10分)
        
        // 游戏全局变量
        let cards = [];               // 存储当前卡片对象 { id, content, type, pairId }
        let selectedCards = [];       // 存储被选中的DOM元素
        let matchedPairs = 0;         // 当前阶段匹配成功的对数
        let mistakes = 0;             // 累计错误次数（跨阶段）
        let score = 100;              // 总分，初始100
        let gameStarted = false;
        let errorWords = [];           // 错误单词记录 [[英文,中文]]
        let currentStage = 1;         // 1 或 2
        let timeLeft = TIME_PER_STAGE;
        let timerInterval = null;
        let stageCompleteFlag = false;
        
        // DOM 元素
        const gameBoard = document.getElementById('game-board');
        const remainingSpan = document.getElementById('remaining');
        const mistakesSpan = document.getElementById('mistakes');
        const scoreSpan = document.getElementById('score');
        const timerSpan = document.getElementById('timer');
        const stageIndicator = document.getElementById('stage-indicator');
        const stageCompleteDiv = document.getElementById('stage-complete');
        const startBtn = document.getElementById('start');
        const restartBtn = document.getElementById('restart');
        const resultModal = document.getElementById('result-modal');
        const finalScoreSpan = document.getElementById('final-score');
        const finalStageSpan = document.getElementById('final-stage');
        const finalRemainingSpan = document.getElementById('final-remaining');
        const finalMistakesSpan = document.getElementById('final-mistakes');
        const playerNameInput = document.getElementById('player-name');
        const submitScoreBtn = document.getElementById('submit-score');
        const successMsg = document.getElementById('success-message');
        const errorWordsContainer = document.getElementById('error-words');
        const errorListDiv = document.getElementById('error-list');
        
        // ---------- 辅助函数 ----------
        function updateUIStats() {
            // 更新剩余卡片（当前阶段未匹配卡片数）
            const totalCards = cards.length;
            const matchedCount = matchedPairs * 2;
            const remaining = totalCards - matchedCount;
            remainingSpan.textContent = remaining;
            // 更新错误显示
            mistakesSpan.textContent = `${mistakes}/${MAX_MISTAKES}`;
            // 更新得分
            scoreSpan.textContent = score;
        }
        
        // 更新错误单词显示
        function updateErrorWordsDisplay() {
            if (errorWords.length > 0) {
                errorWordsContainer.style.display = "block";
                errorListDiv.innerHTML = "";
                errorWords.forEach(pair => {
                    const errorItem = document.createElement('div');
                    errorItem.classList.add('error-item');
                    errorItem.textContent = `${pair[0]}  ↔  ${pair[1]}`;
                    errorListDiv.appendChild(errorItem);
                });
            } else {
                errorWordsContainer.style.display = "none";
            }
        }
        
        // 记录错误配对（去重记录单词对）
        function addErrorWordPair(pairId) {
            // 从原始词库中找到对应的完整中英文对
            const wordPair = wordPairs.find(pair => pair[0] === pairId);
            if (wordPair) {
                const exists = errorWords.some(item => item[0] === wordPair[0] && item[1] === wordPair[1]);
                if (!exists) {
                    errorWords.push([wordPair[0], wordPair[1]]);
                    updateErrorWordsDisplay();
                }
            }
        }
        
        // 洗牌算法
        function shuffleArray(arr) {
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }
        
        // 根据当前阶段初始化卡片 (10组单词 = 20卡片)
        function buildStageCards(stage) {
            let stageWords;
            if (stage === 1) {
                stageWords = wordPairs.slice(0, 10);   // 前10组
                stageIndicator.textContent = "🌟 第一阶段：基础10组单词 (轻松闯关)";
            } else {
                stageWords = wordPairs.slice(10, 20);   // 后10组
                stageIndicator.textContent = "🚀 第二阶段：进阶10组单词 (坚持就是胜利)";
            }
            let newCards = [];
            stageWords.forEach(pair => {
                newCards.push({
                    id: pair[0] + "-en",
                    content: pair[0],
                    type: 'english',
                    pairId: pair[0]
                });
                newCards.push({
                    id: pair[1] + "-cn",
                    content: pair[1],
                    type: 'chinese',
                    pairId: pair[0]
                });
            });
            return shuffleArray(newCards);
        }
        
        // 重新渲染游戏板 (根据当前cards数组)
        function renderGameBoard() {
            gameBoard.innerHTML = '';
            cards.forEach((card, idx) => {
                const cardDiv = document.createElement('div');
                cardDiv.className = 'card';
                cardDiv.dataset.id = card.id;
                cardDiv.dataset.pairId = card.pairId;
                cardDiv.dataset.type = card.type;
                cardDiv.textContent = card.content;
                cardDiv.addEventListener('click', () => selectCard(cardDiv));
                gameBoard.appendChild(cardDiv);
            });
            updateUIStats();
        }
        
        // 重置当前阶段（不清除总错误/总分，只重置卡片状态）
        function resetCurrentStage(stage) {
            // 清除所有卡片选中样式
            selectedCards = [];
            matchedPairs = 0;
            stageCompleteFlag = false;
            cards = buildStageCards(stage);
            renderGameBoard();
        }
        
        // 停止计时器
        function stopTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
            }
        }
        
        // 开始计时 (使用全局 TIME_PER_STAGE)
        function startTimer() {
            stopTimer();
            // 时间已经在外层设置好，直接使用 timeLeft
            timerSpan.textContent = timeLeft;
            timerSpan.classList.remove("timer-critical");
            
            timerInterval = setInterval(() => {
                if (!gameStarted || stageCompleteFlag) return; // 游戏暂停或阶段切换时不计时
                if (timeLeft <= 0) {
                    // 时间耗尽，游戏结束
                    clearInterval(timerInterval);
                    timerInterval = null;
                    endGame(false);
                } else {
                    timeLeft--;
                    timerSpan.textContent = timeLeft;
                    if (timeLeft <= 12) {
                        timerSpan.classList.add("timer-critical");
                    } else {
                        timerSpan.classList.remove("timer-critical");
                    }
                }
            }, 1000);
        }
        
        // 结束游戏 (胜利或失败)
        function endGame(isWin) {
            if (!gameStarted && timerInterval === null && resultModal.style.display === 'flex') return;
            gameStarted = false;
            stopTimer();
            // 显示结算窗口
            finalScoreSpan.textContent = score;
            finalStageSpan.textContent = currentStage;
            const remainingTotal = cards.length - (matchedPairs * 2);
            finalRemainingSpan.textContent = remainingTotal;
            finalMistakesSpan.textContent = `${mistakes}/${MAX_MISTAKES}`;
            resultModal.style.display = 'flex';
        }
        
        // 完成当前阶段
        function completeStage() {
            if (stageCompleteFlag) return;
            stageCompleteFlag = true;
            
            if (currentStage === 1) {
                // 第一阶段完成，展示过渡，准备进入第二阶段
                stageCompleteDiv.style.display = "block";
                stopTimer();   // 暂停计时器，避免阶段间倒计时干扰
                
                setTimeout(() => {
                    stageCompleteDiv.style.display = "none";
                    currentStage = 2;
                    // 重置阶段相关卡片和配对计数
                    matchedPairs = 0;
                    selectedCards = [];
                    cards = buildStageCards(2);
                    renderGameBoard();
                    stageCompleteFlag = false;
                    // 重置该阶段剩余时间
                    timeLeft = TIME_PER_STAGE;
                    timerSpan.textContent = timeLeft;
                    timerSpan.classList.remove("timer-critical");
                    // 游戏仍然处于进行中（gameStarted 一直为true）重启计时器
                    if (gameStarted) {
                        startTimer();
                    }
                }, 1800);
            } 
            else if (currentStage === 2) {
                // 第二阶段完成，游戏胜利
                stopTimer();
                endGame(true);
            }
        }
        
        // 卡片点击匹配逻辑（优化难度，降低惩罚）
        function selectCard(cardElement) {
            // 游戏未开始 或 已经匹配过 或 已选中 或 阶段过渡中，不能点击
            if (!gameStarted || cardElement.classList.contains('matched') || 
                cardElement.classList.contains('selected') || stageCompleteFlag) {
                return;
            }
            
            // 添加选中样式
            cardElement.classList.add('selected');
            selectedCards.push(cardElement);
            
            // 已选两张，进行配对判断
            if (selectedCards.length === 2) {
                const cardA = selectedCards[0];
                const cardB = selectedCards[1];
                const pairIdA = cardA.dataset.pairId;
                const pairIdB = cardB.dataset.pairId;
                const typeA = cardA.dataset.type;
                const typeB = cardB.dataset.type;
                
                // 匹配条件：pairId相同 且 一个是英文一个是中文
                const isMatch = (pairIdA === pairIdB && typeA !== typeB);
                
                if (isMatch) {
                    // 匹配成功
                    setTimeout(() => {
                        cardA.classList.add('matched');
                        cardB.classList.add('matched');
                        // 移除选中样式
                        cardA.classList.remove('selected');
                        cardB.classList.remove('selected');
                        selectedCards = [];
                        matchedPairs++;
                        updateUIStats();
                        
                        // 检查当前阶段是否完全配对
                        if (matchedPairs === cards.length / 2) {
                            completeStage();
                        }
                    }, 280);
                } 
                else {
                    // 匹配失败 —— 难度降低：扣分减少，且错误上限提高
                    mistakes++;
                    // 扣分变少，更友好
                    score = Math.max(0, score - PENALTY_SCORE);
                    updateUIStats();
                    
                    // 记录错误的单词对（根据A卡的pairId）
                    addErrorWordPair(pairIdA);
                    
                    // 显示错误动画
                    cardA.classList.add('error');
                    cardB.classList.add('error');
                    
                    // 延迟后清除样式，恢复待选状态
                    setTimeout(() => {
                        cardA.classList.remove('selected', 'error');
                        cardB.classList.remove('selected', 'error');
                        selectedCards = [];
                        // 检查是否达到最大错误次数
                        if (mistakes >= MAX_MISTAKES) {
                            endGame(false);
                        }
                    }, 700);
                }
            }
        }
        
        // 完全重置游戏（全部状态）
        function fullReset() {
            // 停止任何进行中的计时器
            stopTimer();
            gameStarted = false;
            // 重置全局数据
            mistakes = 0;
            score = 100;
            errorWords = [];
            currentStage = 1;
            matchedPairs = 0;
            selectedCards = [];
            stageCompleteFlag = false;
            timeLeft = TIME_PER_STAGE;
            
            // 重置显示
            scoreSpan.textContent = "100";
            timerSpan.textContent = TIME_PER_STAGE;
            timerSpan.classList.remove("timer-critical");
            mistakesSpan.textContent = `0/${MAX_MISTAKES}`;
            stageCompleteDiv.style.display = "none";
            errorWordsContainer.style.display = "none";
            errorListDiv.innerHTML = "";
            successMsg.style.display = "none";
            resultModal.style.display = "none";
            
            // 构建第一阶段的卡片并渲染
            cards = buildStageCards(1);
            renderGameBoard();
            
            // 重置开始按钮启用状态
            startBtn.disabled = false;
        }
        
        // 开始游戏 (启动所有机制)
        function startGameHandler() {
            if (gameStarted) return;
            // 如果游戏已经结束而还未重启，则重置一下再开始
            if (mistakes >= MAX_MISTAKES || score === 0 && cards.length - matchedPairs*2 > 0) {
                fullReset();
            }
            gameStarted = true;
            startBtn.disabled = true;
            // 重置当前阶段倒计时数值 (避免残留)
            timeLeft = TIME_PER_STAGE;
            timerSpan.textContent = timeLeft;
            startTimer();
        }
        
        // 提交成绩 (模拟API)
        function submitGameScore() {
            const playerName = playerNameInput.value.trim();
            if (!playerName) {
                alert("✨ 请留下名字，记录你的英语进步 ✨");
                return;
            }
            
            const gameResult = {
                name: playerName,
                score: score,
                stage: currentStage === 2 && matchedPairs === cards.length/2 ? 2 : currentStage,
                remaining: cards.length - (matchedPairs * 2),
                mistakes: mistakes,
                maxMistakes: MAX_MISTAKES,
                errorWords: errorWords,
                timestamp: new Date().toISOString(),
                mode: "轻松学习版"
            };
            
            // 模拟提交（与原API一致，但不影响体验）
            fetch('/api/iTX0pyewoEF', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(gameResult)
            })
            .then(response => {
                if (response.ok) {
                    resultModal.style.display = 'none';
                    successMsg.style.display = 'block';
                    setTimeout(() => {
                        successMsg.style.display = 'none';
                    }, 2800);
                } else {
                    alert("网络小问题，但你的成绩已经记录在心里啦！继续游戏吧~");
                    resultModal.style.display = 'none';
                }
            })
            .catch(err => {
                console.warn("提交失败，本地模拟依旧鼓励:", err);
                alert("成绩已保存在本地记忆中！继续挑战~");
                resultModal.style.display = 'none';
                successMsg.style.display = 'block';
                setTimeout(() => {
                    successMsg.style.display = 'none';
                }, 2500);
            });
        }
        
        // 绑定按钮事件
        startBtn.addEventListener('click', startGameHandler);
        restartBtn.addEventListener('click', () => {
            fullReset();
            startBtn.disabled = false;
            gameStarted = false;
            stopTimer();
        });
        submitScoreBtn.addEventListener('click', submitGameScore);
        
        // 页面加载初始化
        fullReset();
    </script>
</body>
</html>
